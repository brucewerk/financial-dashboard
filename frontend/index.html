<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- viewport-fit=cover libera a área do notch/ilha dinâmica para o app
         desenhar atrás dela; o CSS usa env(safe-area-inset-*) pra não deixar
         nada importante escondido ali. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="description" content="Painel de controle financeiro pessoal: investimentos, contas, evolução patrimonial e relatórios." />
    <meta name="color-scheme" content="light dark" />

    <!-- Cor da barra do navegador/status bar, ajustada por tema claro/escuro -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#1976d2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121212" />

    <!-- Ícones -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- "Adicionar à Tela de Início" no iOS abre em tela cheia, sem barra do Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KLING KLANG" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>KLING KLANG — Controle Financeiro</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
